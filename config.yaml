# Full-stack, frontend, and backend roles for roughly two years of experience.
filters:
  include_titles:
  - \b(software|frontend|front-end|front end|backend|back-end|back end|fullstack|full-stack|full stack|web|product|application)\b.*\b(engineer|developer)\b
  - \b(engineer|developer)\b.*\b(software|frontend|front-end|front end|backend|back-end|back end|fullstack|full-stack|full
    stack|web|react|node\.?js|typescript)\b
  - \bsde\b
  - \b(react|node\.?js|javascript|typescript|mern|next\.?js)\b.*\b(engineer|developer)\b
  exclude_titles:
  - \b(senior|sr\.?|staff|principal|distinguished|fellow|architect|lead)\b
  - \b(director|vp|vice president|head of|chief|cto|manager|management)\b
  - \b(intern|internship|apprentice|trainee)\b
  - \b(sales|account executive|marketing|recruit|support|success)\b
  - \b(ios|android|mobile|game|designer|firmware|embedded|kernel|driver)\b
  - \b(data scientist|data engineer|machine learning|research scientist|qa|sdet|test|testing|devops|sre|security engineer)\b
  locations:
  - india
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - chennai
  - mumbai
  - delhi
  - noida
  - gurgaon
  - gurugram
  - kolkata
  allow_remote: true
  remote_locations:
  - worldwide
  - global
  - anywhere
  - apac
  - asia pacific
  - asia-pacific
  - asia/pacific
  max_age_days: 30
screen_batch_size: 1
screen_jd_chars: 6000
draft_jd_chars: 6000
score_threshold: 7.0
max_per_digest: 5
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
